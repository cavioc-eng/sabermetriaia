name: Sabermetria IA Cloud Engine
on: schedule: - cron: '0 12 * * *' workflow_dispatch:
jobs: ejecutar-motor: runs-on: ubuntu-latest steps: - name: Checkout repositorio uses: actions/checkout@v4
  - name: Configurar Python
    uses: actions/setup-python@v5
    with:
      python-version: '3.10'

  - name: Instalar dependencias
    run: |
      python -m pip install --upgrade pip
      pip install requests pandas openpyxl

  - name: Ejecutar motor maestro
    env:
      WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
      WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID }}
      WHATSAPP_DESTINO: ${{ secrets.WHATSAPP_DESTINO }}
    run: |
      python motor_sabermetria_cloud.py
